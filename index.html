<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כותבים עברית</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6f3ec;color:#28344b;font-family:Arial,sans-serif}main{max-width:760px;min-height:100vh;margin:auto;background:#fffdf7;padding:28px 20px}.hero{text-align:center;padding:22px 0}.logo{width:88px;height:88px;margin:auto;background:#ffd868;border:4px solid white;border-radius:28px;display:grid;place-items:center;font-size:60px;font-weight:bold;box-shadow:0 9px #e4b73c}.hero h1{font-size:48px;margin:24px 0 5px}.hero p{color:#68758a}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{border:0;border-radius:28px;padding:25px;text-align:right;min-height:180px;box-shadow:0 8px #26344b20;font-size:20px}.choice b{display:block;font-size:28px;margin-top:28px}.purple{background:#ddd8ff}.green{background:#cdeedf}.tip{text-align:center;margin-top:35px;color:#657287;font-weight:bold}.hidden{display:none}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #e8ece9;margin:-28px -20px 20px;padding:18px 20px}.top button,.close{border:0;border-radius:14px;padding:12px;background:#edf5f1}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.letter,.food{border:0;border-radius:18px;background:#ffe7a3;padding:12px;font-size:34px;font-weight:bold;min-height:90px}.letter small{display:block;font-family:cursive;font-size:28px}.cats{display:flex;gap:8px;overflow:auto;margin:15px 0}.cats button{white-space:nowrap;border:2px solid #dfe6e2;border-radius:16px;background:white;padding:10px}.cats button.active{background:#315f50;color:#fff}.foodgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.food{font-size:18px;background:#e1f2e8}.food span{display:block;font-size:52px}.modal{position:fixed;inset:0;background:#20352d99;display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.card{background:#fffdf7;border-radius:30px;padding:28px;text-align:center;width:min(440px,100%);position:relative}.card .pic{font-size:110px}.card .pic:empty{display:none}.card h2{font-size:46px;margin:12px}.card .hand{font-family:cursive;font-size:35px}.speak{border:0;border-radius:16px;padding:14px 22px;background:#315f50;color:white;font-weight:bold}@media(max-width:560px){.choices{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,1fr)}.foodgrid{grid-template-columns:repeat(2,1fr)}}
</style><main><section id="home"><div class="hero"><div class="logo">א</div><h1>כותבים עברית</h1><p>בוחרים, מקשיבים ולומדים אותיות ומילים</p></div><div class="choices"><button class="choice purple" onclick="show('letters')">📖<b>אותיות</b>כתב דפוס וכתב יד</button><button class="choice green" onclick="show('foods')">🍎🥕<b>מילים וציורים</b>מגלים איך כותבים</button></div><p class="tip">🔊 לחצו על אות או מילה כדי לשמוע אותה</p></section><section id="letters" class="hidden"><div class="top"><button onclick="show('home')">→ חזרה</button><h2>האותיות שלי</h2><button onclick="show('home')">⌂</button></div><h2>בחרו אות</h2><div class="grid" id="lettergrid"></div></section><section id="foods" class="hidden"><div class="top"><button onclick="show('home')">→ חזרה</button><h2>מילים וציורים</h2><button onclick="show('home')">⌂</button></div><h2>מה נלמד היום?</h2><div class="cats" id="cats"></div><div class="foodgrid" id="foodgrid"></div></section></main><div id="modal" class="modal hidden" onclick="closeM()"><div class="card" onclick="event.stopPropagation()"><button class="close" onclick="closeM()">✕</button><div id="detail"></div></div></div><script>
const L=[...'אבגדהוזחטיכלמנסעפצקרשת'],C={all:'🛒 הכול',fruits:'🍎 פירות',vegetables:'🥕 ירקות',dairy:'🥛 מוצרי חלב',sweets:'🍫 ממתקים',bakery:'🥖 מאפים'},F=['תפוח|🍎|fruits','בננה|🍌|fruits','תפוז|🍊|fruits','גזר|🥕|vegetables','עגבנייה|🍅|vegetables','מלפפון|🥒|vegetables','חלב|🥛|dairy','גבינה|🧀|dairy','יוגורט|🥣|dairy','שוקולד|🍫|sweets','סוכרייה|🍬|sweets','עוגייה|🍪|sweets','לחם|🍞|bakery','פיתה|🫓|bakery'].map(x=>x.split('|'));function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=.78;speechSynthesis.speak(u)}function show(id){['home','letters','foods'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function openM(n,p=''){say(n);detail.innerHTML=`<div class="pic">${p}</div><p>כך כותבים</p><h2>${n}</h2><div class="hand">${n}</div><br><button class="speak" onclick="say('${n}')">🔊 השמיעו שוב</button>`;modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}lettergrid.innerHTML=L.map(x=>`<button class="letter" onclick="openM('${x}')">${x}<small>${x}</small>🔊</button>`).join('');cats.innerHTML=Object.entries(C).map(([k,v])=>`<button onclick="draw('${k}',this)">${v}</button>`).join('');function draw(k,b){document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');foodgrid.innerHTML=F.filter(x=>k==='all'||x[2]===k).map(x=>`<button class="food" onclick="openM('${x[0]}','${x[1]}')"><span>${x[1]}</span>${x[0]}</button>`).join('')}draw('all',cats.firstElementChild);
</script></html>
