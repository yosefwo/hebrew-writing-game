<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e7f3ec"><title>כותבים עברית</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Miriam+Libre:wght@400;700&family=Gveret+Levin&display=swap" rel="stylesheet"><style>
:root{--ink:#26344b;--green:#315f50;--paper:#fffdf7;--yellow:#ffd868;--purple:#ddd8ff}*{box-sizing:border-box}body{margin:0;background:#e6f3ec;color:var(--ink);font-family:"Miriam Libre",Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}main{max-width:760px;min-height:100vh;margin:auto;background:var(--paper);padding:26px 20px}.hidden{display:none!important}.hero{text-align:center;padding:16px 0 24px}.logo{width:86px;height:86px;margin:auto;background:var(--yellow);border:4px solid white;border-radius:28px;display:grid;place-items:center;font-size:58px;font-weight:700;box-shadow:0 9px #e4b73c}.hero h1{font-size:46px;margin:22px 0 5px}.hero p{color:#68758a;font-size:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{border:0;border-radius:26px;padding:22px;text-align:right;min-height:155px;box-shadow:0 7px #26344b18;font-size:17px}.choice b{display:block;font-size:25px;margin-top:22px}.purple{background:#ddd8ff}.green{background:#cdeedf}.pink{background:#f8dfe8}.blue{background:#ddecfa}.tip{text-align:center;margin-top:30px;color:#657287;font-weight:700}.top{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;border-bottom:2px solid #e8ece9;margin:-26px -20px 20px;padding:15px 20px}.top h2{text-align:center;margin:0}.top button,.close{border:0;border-radius:14px;padding:12px;background:#edf5f1}.intro{margin:18px 0 12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.letter{border:0;border-radius:18px;background:#ffe7a3;padding:9px;font-size:34px;font-weight:700;min-height:92px}.letter .hand{display:block}.hand{font-family:"Guttman Yad","Gveret Levin",cursive;font-size:32px}.letter:nth-child(6n+2){background:#dcecff}.letter:nth-child(6n+3){background:#d8f1e2}.letter:nth-child(6n+4){background:#f3daf0}.letter:nth-child(6n+5){background:#ffdcd1}.letter:nth-child(6n){background:#e1ddff}.cats{display:flex;gap:8px;overflow:auto;margin:12px 0 17px}.cats button{white-space:nowrap;border:2px solid #dfe6e2;border-radius:16px;background:white;padding:9px 13px}.cats button.active{background:var(--green);color:#fff}.foodgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.food{border:0;border-radius:19px;background:#e1f2e8;padding:12px;font-size:17px;font-weight:700;min-height:132px}.food span{display:block;font-size:52px}.modal{position:fixed;inset:0;background:#20352d99;display:grid;place-items:center;padding:18px;z-index:10}.modal.hidden{display:none}.card{background:var(--paper);border-radius:30px;padding:25px;text-align:center;width:min(460px,100%);position:relative;max-height:92vh;overflow:auto}.close{position:absolute;left:16px;top:16px}.pic{font-size:105px;line-height:1.15}.card h2{font-size:42px;margin:6px}.full-word{font-size:38px;font-weight:700;margin:10px}.word-slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0;direction:rtl}.slot{width:43px;height:52px;border-radius:10px;background:#fff0ba;display:grid;place-items:center;font-size:29px;font-weight:700}.slot.missing{background:white;border-bottom:5px solid var(--ink);border-radius:0}.slot.wrong{color:#d32f2f;border-color:#d32f2f;background:#ffe4e4;animation:shake .25s}.answers{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.answer{width:62px;height:62px;border:3px solid #d8e3dd;background:white;border-radius:18px;font-size:34px;font-weight:700}.answer:active{transform:scale(.94)}.success{font-size:26px;color:#168052;font-weight:700;margin:13px}.speak,.next{border:0;border-radius:16px;padding:13px 21px;background:var(--green);color:white;font-weight:700;margin:8px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.memory-card{aspect-ratio:1;border:0;border-radius:18px;background:#6554c8;color:white;font-size:0;box-shadow:0 5px #453895;transition:.2s}.memory-card::after{content:"?";font-size:32px}.memory-card.open,.memory-card.done{background:#fff0ba;color:var(--ink);font-size:35px;transform:rotateY(180deg)}.memory-card.open::after,.memory-card.done::after{display:none}.memory-card.done{background:#ccefdc}.listen-prompt{text-align:center;background:#e1ddff;border-radius:24px;padding:24px;margin-bottom:18px}.listen-prompt .big-sound{font-size:58px;border:0;background:white;border-radius:50%;width:94px;height:94px}.listen-prompt p{font-size:22px;font-weight:700}.feedback{text-align:center;min-height:38px;font-size:23px;font-weight:700}.wrong-pick{background:#ffd6d6!important;color:#b71c1c!important}.right-pick{background:#ccefdc!important;color:#126c45!important}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:560px){.choices{grid-template-columns:1fr}.choice{min-height:125px}.choice b{margin-top:12px}.grid{grid-template-columns:repeat(4,1fr)}.foodgrid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:42px}.memory-grid{gap:9px}}
</style><style>
.memory-card.open,.memory-card.done{transform:none}
.profile-box{max-width:480px;margin:8vh auto;background:#fff;border:3px solid #dfeae4;border-radius:30px;padding:28px;text-align:center;box-shadow:0 10px #315f5020}.profile-box h1{font-size:38px;margin:10px}.profile-box label{display:block;text-align:right;font-weight:700;margin:18px 0 7px}.profile-box input{width:100%;font:inherit;font-size:22px;border:2px solid #ccd9d2;border-radius:15px;padding:13px}.gender-row,.size-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.gender-row button,.size-row button{border:2px solid #ccd9d2;background:white;border-radius:16px;padding:13px 22px;font-weight:700}.gender-row button.selected,.size-row button.selected{background:var(--green);color:#fff;border-color:var(--green)}.profile-save{width:100%;border:0;background:var(--green);color:white;border-radius:17px;padding:14px;font-size:20px;font-weight:700;margin-top:23px}.welcome-line{display:flex;align-items:center;justify-content:center;gap:10px;background:#edf6f1;border-radius:16px;padding:10px;margin:-4px auto 18px;max-width:380px;font-weight:700}.welcome-line button{border:0;background:transparent;text-decoration:underline;font-size:13px}.memory-setup{text-align:center;background:#f4eafa;border-radius:24px;padding:22px;margin:18px 0}.memory-setup h3{font-size:24px;margin:0 0 15px}
</style></head><body><main>
<section id="profile" class="hidden"><div class="profile-box"><div class="logo">א</div><h1>מי משחק/ת?</h1><p>נשמור את השם בטלפון הזה</p><label for="playername">שם הילד או הילדה</label><input id="playername" maxlength="20" autocomplete="name" placeholder="לדוגמה: נריה"><label>מי משחק/ת?</label><div class="gender-row"><button id="boybtn" onclick="chooseGender('boy')">👦 בן</button><button id="girlbtn" onclick="chooseGender('girl')">👧 בת</button></div><button class="profile-save" onclick="saveProfile()">מתחילים</button><div id="profileerror" class="feedback"></div></div></section>
<section id="home"><div class="hero"><div class="logo">א</div><h1>כותבים עברית</h1><p>מקשיבים, מזהים ומשחקים באותיות ובמילים</p></div><div id="welcomeline" class="welcome-line hidden"><span id="welcometext"></span><button onclick="editProfile()">שינוי</button></div><div class="choices">
<button class="choice purple" onclick="show('letters')">א ב <b>מכירים אותיות</b>כתב מרובע וכתב יד</button>
<button class="choice green" onclick="show('foods')">🍎🥕 <b>משלימים מילים</b>ציור, מילה ואות חסרה</button>
<button class="choice pink" onclick="openMemorySetup()">🃏 <b>משחק זיכרון</b>מוצאים זוגות של אותיות</button>
<button class="choice blue" onclick="startListening()">🔊 <b>מצא את האות</b>מקשיבים ולוחצים</button>
</div><p class="tip">לחצו על משחק כדי להתחיל</p></section>
<section id="letters" class="hidden"><div class="top"><button onclick="show('home')">→</button><h2>האותיות שלי</h2><button onclick="show('home')">⌂</button></div><h2 class="intro">בחרו אות</h2><div class="grid" id="lettergrid"></div></section>
<section id="foods" class="hidden"><div class="top"><button onclick="show('home')">→</button><h2>משלימים מילים</h2><button onclick="show('home')">⌂</button></div><div class="cats" id="cats"></div><div class="foodgrid" id="foodgrid"></div></section>
<section id="memory" class="hidden"><div class="top"><button onclick="show('home')">→</button><h2>משחק זיכרון</h2><button onclick="openMemorySetup()">↻</button></div><div id="memorysetup" class="memory-setup"><h3>כמה זוגות?</h3><div class="size-row"><button onclick="startMemory(4)">4 זוגות</button><button onclick="startMemory(6)">6 זוגות</button><button onclick="startMemory(8)">8 זוגות</button></div></div><p id="memoryintro" class="intro hidden">מצאו את כל זוגות האותיות</p><div class="memory-grid" id="memorygrid"></div><div class="feedback" id="memoryfeedback"></div></section>
<section id="listening" class="hidden"><div class="top"><button onclick="show('home')">→</button><h2>מצא את האות</h2><button onclick="startListening()">↻</button></div><div class="listen-prompt"><button class="big-sound" onclick="repeatTarget()">🔊</button><p>איזו אות שמעתם?</p><small id="listenprogress">הצלחות: 0 · שלב 1</small></div><div class="grid" id="listengrid"></div><div class="feedback" id="listenfeedback"></div></section>
</main><div id="modal" class="modal hidden" onclick="closeModal()"><div class="card" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div>
<script>
const letters=[...'אבגדהוזחטיכלמנסעפצקרשת'];
const categories={all:'🛒 הכול',fruits:'🍎 פירות',vegetables:'🥕 ירקות',dairy:'🥛 מוצרי חלב',sweets:'🍫 ממתקים',bakery:'🥖 מאפים'};
const foods=['תפוח|🍎|fruits','בננה|🍌|fruits','תפוז|🍊|fruits','ענבים|🍇|fruits','גזר|🥕|vegetables','עגבנייה|🍅|vegetables','מלפפון|🥒|vegetables','תירס|🌽|vegetables','חלב|🥛|dairy','גבינה|🧀|dairy','יוגורט|🥣|dairy','חמאה|🧈|dairy','שוקולד|🍫|sweets','סוכרייה|🍬|sweets','עוגייה|🍪|sweets','לחם|🍞|bakery','פיתה|🫓|bakery','בייגלה|🥨|bakery'].map(x=>{const[name,emoji,category]=x.split('|');return{name,emoji,category}});
const byId=id=>document.getElementById(id),modal=byId('modal'),detail=byId('detail');
function say(text,rate=.78){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';u.rate=rate;speechSynthesis.speak(u)}
function show(id){['profile','home','letters','foods','memory','listening'].forEach(x=>byId(x).classList.toggle('hidden',x!==id));closeModal()}
function closeModal(){modal.classList.add('hidden')}
byId('lettergrid').innerHTML=letters.map(l=>`<button class="letter" onclick="showLetter('${l}')">${l}<span class="hand">${l}</span>🔊</button>`).join('');
function showLetter(l){say(l);detail.innerHTML=`<p>זאת האות</p><div style="font-size:92px;font-weight:700">${l}</div><div class="hand" style="font-size:70px">${l}</div><button class="speak" onclick="say('${l}')">🔊 השמיעו שוב</button>`;modal.classList.remove('hidden')}
byId('cats').innerHTML=Object.entries(categories).map(([k,v])=>`<button onclick="drawFoods('${k}',this)">${v}</button>`).join('');
function drawFoods(category,button){document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');byId('foodgrid').innerHTML=foods.filter(f=>category==='all'||f.category===category).map((f,i)=>`<button class="food" onclick="wordGame(${foods.indexOf(f)})"><span>${f.emoji}</span>${f.name}</button>`).join('')}
function shuffled(array){return [...array].sort(()=>Math.random()-.5)}
let activeFood=null,missingIndex=0;
function wordGame(index){activeFood=foods[index];missingIndex=Math.floor(Math.random()*activeFood.name.length);say(activeFood.name);renderWord(true);modal.classList.remove('hidden');setTimeout(()=>renderWord(false),1300)}
function renderWord(preview){const chars=[...activeFood.name];const correct=chars[missingIndex];let options=shuffled([correct,...shuffled(letters.filter(l=>l!==correct)).slice(0,3)]);detail.innerHTML=`<div class="pic">${activeFood.emoji}</div><p>${preview?'זכרו את המילה':'השלימו את האות החסרה'}</p><div class="full-word">${preview?activeFood.name:''}</div><div class="word-slots">${chars.map((c,i)=>`<span id="slot${i}" class="slot ${!preview&&i===missingIndex?'missing':''}">${preview||i!==missingIndex?c:''}</span>`).join('')}</div>${preview?'':`<div class="answers">${options.map(l=>`<button class="answer" onclick="checkLetter('${l}',this)">${l}</button>`).join('')}</div>`}`}
function checkLetter(chosen,button){const correct=[...activeFood.name][missingIndex],slot=byId('slot'+missingIndex);if(chosen===correct){slot.textContent=correct;slot.classList.remove('missing');button.classList.add('right-pick');applause();detail.insertAdjacentHTML('beforeend','<div class="success">👏 כל הכבוד! 👏</div><button class="next" onclick="wordGame(foods.indexOf(activeFood))">עוד אות</button>');document.querySelectorAll('.answer').forEach(b=>b.disabled=true)}else{button.classList.add('wrong-pick');slot.textContent=chosen;slot.classList.add('wrong');say('נסה שוב');setTimeout(()=>{button.classList.remove('wrong-pick');slot.textContent='';slot.classList.remove('wrong')},750)}}
function applause(){say('כל הכבוד');const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.11,.22,.34].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=[660,880,990,1320][i];g.gain.setValueAtTime(.08,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.18);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.2)})}
drawFoods('all',byId('cats').firstElementChild);
let opened=[],matched=0,memoryPairs=6;
function openMemorySetup(){show('memory');byId('memorysetup').classList.remove('hidden');byId('memoryintro').classList.add('hidden');byId('memorygrid').innerHTML='';byId('memoryfeedback').textContent=''}
function startMemory(size){memoryPairs=size||memoryPairs;byId('memorysetup').classList.add('hidden');byId('memoryintro').classList.remove('hidden');const chosen=shuffled(letters).slice(0,memoryPairs),deck=shuffled([...chosen,...chosen]);opened=[];matched=0;byId('memoryfeedback').textContent='';byId('memorygrid').innerHTML=deck.map((l,i)=>`<button id="mem${i}" class="memory-card" data-letter="${l}" onclick="flipCard(${i})">${l}</button>`).join('')}
function flipCard(i){const card=byId('mem'+i);if(opened.length===2||card.classList.contains('open')||card.classList.contains('done'))return;card.classList.add('open');say(card.dataset.letter);opened.push(card);if(opened.length===2){if(opened[0].dataset.letter===opened[1].dataset.letter){opened.forEach(c=>c.classList.add('done'));opened=[];matched++;if(matched===memoryPairs){byId('memoryfeedback').textContent='👏 כל הכבוד! מצאתם את כל הזוגות';applause()}}else setTimeout(()=>{opened.forEach(c=>c.classList.remove('open'));opened=[]},850)}}
let targetLetter='',listenSuccesses=0;
function startListening(){show('listening');listenSuccesses=0;updateListenProgress();nextTarget()}
function updateListenProgress(){byId('listenprogress').textContent='הצלחות: '+listenSuccesses+' · שלב '+(Math.floor(listenSuccesses/5)+1)}
function nextTarget(){targetLetter=letters[Math.floor(Math.random()*letters.length)];byId('listenfeedback').textContent='';const choices=shuffled([targetLetter,...shuffled(letters.filter(l=>l!==targetLetter)).slice(0,11)]);byId('listengrid').innerHTML=choices.map(l=>`<button class="letter" onclick="checkHeard('${l}',this)">${l}<span class="hand">${l}</span></button>`).join('');setTimeout(repeatTarget,350)}
function repeatTarget(){say('האות '+targetLetter)}
function checkHeard(chosen,button){if(chosen===targetLetter){button.classList.add('right-pick');listenSuccesses++;updateListenProgress();if(listenSuccesses%5===0){const profile=getProfile(),message=profile.name+', '+(profile.gender==='girl'?'את אלופה':'אתה אלוף')+'! עברת שלב';byId('listenfeedback').textContent='🏆 '+message;say(message);setTimeout(nextTarget,2400)}else{byId('listenfeedback').textContent='👏 כל הכבוד!';applause();setTimeout(nextTarget,1400)}}else{button.classList.add('wrong-pick');byId('listenfeedback').textContent='נסה שוב';say('נסה שוב');setTimeout(()=>button.classList.remove('wrong-pick'),700)}}
let selectedGender='';
function chooseGender(gender){selectedGender=gender;byId('boybtn').classList.toggle('selected',gender==='boy');byId('girlbtn').classList.toggle('selected',gender==='girl')}
function saveProfile(){const name=byId('playername').value.trim();if(!name||!selectedGender){byId('profileerror').textContent='צריך לכתוב שם ולבחור בן או בת';return}localStorage.setItem('hebrewGameProfile',JSON.stringify({name,gender:selectedGender}));byId('profileerror').textContent='';showHomeWithGreeting(true)}
function getProfile(){try{return JSON.parse(localStorage.getItem('hebrewGameProfile'))}catch{return null}}
function greeting(profile){return (profile.gender==='girl'?'ברוכה הבאה ':'ברוך הבא ')+profile.name}
function showHomeWithGreeting(speakNow){const profile=getProfile();if(!profile){show('profile');return}show('home');byId('welcomeline').classList.remove('hidden');byId('welcometext').textContent=greeting(profile);if(speakNow)setTimeout(()=>say(greeting(profile)),250)}
function editProfile(){const profile=getProfile();byId('playername').value=profile?.name||'';chooseGender(profile?.gender||'');show('profile')}
document.addEventListener('DOMContentLoaded',()=>{const profile=getProfile();if(profile)showHomeWithGreeting(true);else show('profile')});
</script></body></html>
